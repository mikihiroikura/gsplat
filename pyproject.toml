[project]
name = "gsplat-uv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gsplat>=1.5.3",
    "imageio[ffmpeg]>=2.37.3",
    "matplotlib>=3.10.8",
    "nerfview",
    "numpy<2.0.0",
    "nvidia-ncore==18.6.0",
    "opencv-python>=4.11.0.86",
    "piexif>=1.1.3",
    "pillow>=12.2.0",
    "pycolmap",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tensorboard>=2.20.0",
    "tensorly>=0.9.0",
    "torch>=2.11.0",
    "torchmetrics[image]>=1.9.0",
    "tqdm>=4.67.3",
    "tyro>=1.0.12",
    "viser>=1.0.26",
    "fused-ssim",
    "fused-bilagrid",
    "splines>=0.3.3",
    "ppisp",
]

[tool.uv.extra-build-dependencies]
fused-ssim = ["torch"]
fused-bilagrid = ["torch"]
ppisp = ["torch"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130"},
]
pycolmap = { git = "https://github.com/rmbrualla/pycolmap", rev = "cc7ea4b7301720ac29287dbe450952511b32125e" }
nerfview = { git = "https://github.com/nerfstudio-project/nerfview", rev = "4538024fe0d15fd1a0e4d760f3695fc44ca72787" }
fused-ssim = { git = "https://github.com/rahul-goel/fused-ssim", rev = "328dc9836f513d00c4b5bc38fe30478b4435cbb5" }
fused-bilagrid = { git = "https://github.com/harry7557558/fused-bilagrid", rev = "49f0ef06c9f81810fb9b5dd9027cf1844950cc16" }
ppisp = { git = "https://github.com/nv-tlabs/ppisp", tag = "v1.0.0" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
